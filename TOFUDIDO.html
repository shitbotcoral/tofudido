<!--
  TÔ FUDIDO — controle financeiro
  Diário (compras rápidas + crédito por cartão) + Mensal (contas de casa)
  Identidade: branco + verde. Cartões com cor própria. Fatura vence dia 9.
  Ícones SVG inline. Persistência via window.storage.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TÔ FUDIDO</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root{
    --verde:#16A34A; --verde-vivo:#22C55E; --verde-escuro:#064E3B;
    --verde-claro:#DCFCE7; --mint:#ECFDF5; --creme:#F4FBF6; --branco:#FFFFFF;
    --carvao:#0B1F17; --cinza:#6B8077; --cinza-claro:#E3EFE8;
    --alerta:#E11D48; --alerta-bg:#FFE4E9; --ambar:#D97706; --ambar-bg:#FEF3C7;
    --sombra-sm:0 1px 2px rgba(6,78,59,.06),0 1px 3px rgba(6,78,59,.05);
    --sombra-md:0 6px 20px rgba(6,78,59,.10);
    --sombra-lg:0 18px 50px rgba(6,78,59,.16);
    --raio:18px; --raio-sm:12px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif; color:var(--carvao);
    background:var(--creme); display:flex; justify-content:center; overflow:hidden; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input,select{ font-family:inherit; }
  ::selection{ background:var(--verde-claro); }

  .ic{ width:18px; height:18px; flex:none; vertical-align:-3px; }
  .ic-sm{ width:16px; height:16px; }
  .ic-xs{ width:13px; height:13px; }
  .ic-btn{ width:18px; height:18px; vertical-align:-4px; }
  .icone .ic{ width:20px; height:20px; vertical-align:0; }
  .term-status .emoji .ic{ width:22px; height:22px; vertical-align:-4px; }
  .vazio .face .ic{ width:46px; height:46px; vertical-align:0; stroke-width:1.6; }
  .inline-cat{ width:15px; height:15px; vertical-align:-2px; }
  .checkbtn .ic{ width:16px; height:16px; vertical-align:0; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot-alta{ background:var(--alerta); } .dot-media{ background:var(--ambar); } .dot-baixa{ background:var(--verde); }

  .app{ width:100%; max-width:440px; height:100dvh; display:flex; flex-direction:column;
    background:var(--creme); position:relative; overflow:hidden; }
  @media (min-width:480px){
    body{ align-items:center; padding:24px;
      background:radial-gradient(1200px 600px at 20% -10%,#D6F5E2 0%,transparent 55%),
                 radial-gradient(900px 500px at 110% 110%,#C9F0DA 0%,transparent 50%),#EAF7EF; }
    .app{ height:min(896px,94vh); border-radius:34px;
      box-shadow:var(--sombra-lg),0 0 0 10px #fff,0 0 0 12px rgba(6,78,59,.08); overflow:hidden; }
  }

  .topo{ flex:none; padding:18px 18px 14px; background:linear-gradient(180deg,var(--verde-escuro),#075E45); color:#fff; position:relative; z-index:5; }
  .topo-linha{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .logo{ font-family:'Anton',sans-serif; font-size:26px; letter-spacing:.5px; line-height:.9; text-transform:uppercase; }
  .logo small{ display:block; font-family:'Plus Jakarta Sans'; font-weight:600; font-size:9.5px; letter-spacing:2.5px; opacity:.7; margin-top:4px; }
  .logo .fudido{ color:var(--verde-vivo); }
  .mes-nav{ display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.12); border-radius:999px; padding:4px; }
  .mes-nav button{ width:30px; height:30px; border-radius:50%; color:#fff; display:grid; place-items:center; transition:background .15s; }
  .mes-nav button:hover{ background:rgba(255,255,255,.18); }
  .mes-nav button .ic{ width:18px; height:18px; vertical-align:0; }
  .mes-nav .mes-label{ min-width:104px; text-align:center; font-weight:700; font-size:13px; text-transform:capitalize; }
  .mes-nav .mes-label span{ display:block; font-size:9.5px; font-weight:600; opacity:.65; letter-spacing:1px; }

  main{ flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 16px 96px; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; }
  main::-webkit-scrollbar{ width:0; }
  .view{ display:none; animation:fade .25s ease; }
  .view.ativa{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion:reduce){ .view,*{ animation:none !important; } main{ scroll-behavior:auto; } }

  .termometro{ border-radius:24px; padding:20px; color:#fff; box-shadow:var(--sombra-md); margin-bottom:14px; position:relative; overflow:hidden; }
  .termometro::after{ content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.10); }
  .term-tranquilo{ background:linear-gradient(135deg,var(--verde),#15803D); }
  .term-atencao{ background:linear-gradient(135deg,#F59E0B,#D97706); }
  .term-fudido{ background:linear-gradient(135deg,#F43F5E,#BE123C); }
  .term-neutro{ background:linear-gradient(135deg,#475569,#334155); }
  .term-status{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; letter-spacing:.3px; position:relative; z-index:1; }
  .term-label{ font-size:11px; font-weight:600; opacity:.85; margin-top:14px; letter-spacing:.5px; text-transform:uppercase; position:relative; z-index:1; }
  .term-saldo{ font-size:34px; font-weight:800; letter-spacing:-1px; margin-top:2px; position:relative; z-index:1; font-variant-numeric:tabular-nums; }
  .term-frase{ font-size:12px; opacity:.9; margin-top:8px; position:relative; z-index:1; font-weight:500; }

  .stats-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat{ background:var(--branco); border-radius:var(--raio); padding:14px; box-shadow:var(--sombra-sm); border:1px solid var(--cinza-claro); }
  .stat .rotulo{ font-size:11px; color:var(--cinza); font-weight:600; display:flex; align-items:center; gap:5px; }
  .stat .valor{ font-size:19px; font-weight:800; margin-top:6px; font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
  .stat.entrada .valor,.stat.entrada .rotulo{ color:var(--verde); }
  .stat.saida .valor,.stat.saida .rotulo{ color:var(--alerta); }

  .bloco{ background:var(--branco); border-radius:var(--raio); padding:16px; box-shadow:var(--sombra-sm); border:1px solid var(--cinza-claro); margin-bottom:14px; }
  .bloco-titulo{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .bloco-titulo h2{ font-size:14px; font-weight:800; display:flex; align-items:center; gap:7px; }
  .bloco-titulo .acao{ font-size:12px; font-weight:700; color:var(--verde); display:flex; align-items:center; gap:3px; }
  .bloco-titulo .nota9{ font-size:10px; font-weight:700; color:var(--ambar); background:var(--ambar-bg); padding:3px 8px; border-radius:999px; }
  .titulo-secao{ font-size:13px; font-weight:800; color:var(--verde-escuro); margin:4px 2px 10px; display:flex; align-items:center; gap:7px; }

  .item{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--cinza-claro); }
  .item:first-child{ border-top:none; }
  .item .icone{ width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center; background:var(--mint); color:var(--verde-escuro); }
  .item .corpo{ flex:1; min-width:0; }
  .item .corpo .nome{ font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .item .corpo .sub{ font-size:11.5px; color:var(--cinza); margin-top:2px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .item .preco{ font-weight:800; font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .item .preco.neg{ color:var(--alerta); }

  .tag{ font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; letter-spacing:.2px; }
  .tag.alta{ background:var(--alerta-bg); color:var(--alerta); }
  .tag.media{ background:var(--ambar-bg); color:var(--ambar); }
  .tag.baixa{ background:var(--verde-claro); color:var(--verde-escuro); }
  .tag.venc{ background:var(--ambar-bg); color:var(--ambar); }
  .tag.atrasada{ background:var(--alerta-bg); color:var(--alerta); }
  .tag.hoje{ background:#FEF9C3; color:#A16207; }
  .tag.paga{ background:var(--verde-claro); color:var(--verde-escuro); }
  .tag.metodo{ background:var(--cinza-claro); color:var(--cinza); }
  .tag.cartao{ color:#fff; }

  .item-botoes{ display:flex; gap:4px; flex:none; }
  .mini-btn{ width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:var(--cinza); transition:background .15s,color .15s; }
  .mini-btn:hover{ background:var(--cinza-claro); color:var(--carvao); }
  .mini-btn.del:hover{ background:var(--alerta-bg); color:var(--alerta); }
  .checkbtn{ width:26px; height:26px; border-radius:8px; flex:none; border:2px solid var(--cinza-claro); display:grid; place-items:center; color:#fff; transition:all .15s; }
  .checkbtn.on{ background:var(--verde); border-color:var(--verde); }

  .progresso{ height:9px; border-radius:999px; background:var(--cinza-claro); overflow:hidden; margin-top:4px; }
  .progresso>span{ display:block; height:100%; background:linear-gradient(90deg,var(--verde-vivo),var(--verde)); border-radius:999px; transition:width .4s ease; }
  .resumo-mensal{ display:flex; justify-content:space-between; font-size:12px; margin-top:9px; }
  .resumo-mensal b{ font-variant-numeric:tabular-nums; }

  /* cartões na prévia (dashboard) */
  .cartao-linha{ display:flex; align-items:center; gap:11px; padding:11px 0; border-top:1px solid var(--cinza-claro); }
  .cartao-linha:first-child{ border-top:none; }
  .cartao-badge{ width:40px; height:40px; border-radius:11px; display:grid; place-items:center; color:#fff; flex:none; box-shadow:var(--sombra-sm); }
  .cartao-badge .ic{ width:21px; height:21px; }
  .cartao-info{ flex:1; min-width:0; }
  .cartao-info .nome{ font-weight:800; font-size:14px; }
  .cartao-info .qtd{ font-size:11px; color:var(--cinza); font-weight:600; margin-top:1px; }
  .cartao-valor{ font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
  .cartao-total{ border-top:2px solid var(--cinza-claro); margin-top:10px; padding-top:12px; display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:15px; }
  .cartao-total span small{ display:block; font-size:10px; font-weight:600; color:var(--cinza); text-transform:uppercase; letter-spacing:.5px; }

  .composer{ background:var(--branco); border-radius:var(--raio); padding:14px; box-shadow:var(--sombra-md); border:1px solid var(--cinza-claro); margin-bottom:14px; }
  .comp-linha{ display:flex; gap:9px; margin-bottom:10px; }
  .campo-moeda{ position:relative; flex:none; width:128px; }
  .campo-moeda .cifrao{ position:absolute; left:12px; top:50%; transform:translateY(-50%); font-weight:800; color:var(--verde); font-size:14px; }
  .campo-moeda input{ width:100%; padding:12px 12px 12px 30px; border-radius:var(--raio-sm); border:1.5px solid var(--cinza-claro); background:var(--mint); font-size:17px; font-weight:800; color:var(--carvao); outline:none; font-variant-numeric:tabular-nums; }
  .input-texto{ flex:1; padding:12px 14px; border-radius:var(--raio-sm); border:1.5px solid var(--cinza-claro); background:var(--branco); font-size:14px; font-weight:500; color:var(--carvao); outline:none; min-width:0; }
  input:focus,select:focus,.campo-moeda input:focus{ border-color:var(--verde); box-shadow:0 0 0 3px var(--verde-claro); }

  .label-mini{ font-size:10px; font-weight:700; color:var(--cinza); text-transform:uppercase; letter-spacing:.6px; margin:2px 2px 6px; }
  .chips{ display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:none; padding:7px 12px; border-radius:999px; font-size:12px; font-weight:700; background:var(--mint); color:var(--verde-escuro); border:1.5px solid transparent; display:flex; align-items:center; gap:5px; white-space:nowrap; transition:all .15s; }
  .chip.on{ background:var(--verde); color:#fff; box-shadow:var(--sombra-sm); }
  .card-chip .dot{ width:11px; height:11px; background:var(--c); }
  .card-chip.on{ background:var(--c); color:#fff; border-color:var(--c); }
  .card-chip.on .dot{ background:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.5); }
  .parc-chip{ min-width:42px; justify-content:center; }

  .credito-box{ display:none; border-top:1px dashed var(--cinza-claro); margin-top:2px; padding-top:12px; }
  .credito-box.on{ display:block; animation:fade .2s ease; }

  .btn-add{ width:100%; padding:14px; border-radius:var(--raio-sm); background:var(--verde); color:#fff; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 14px rgba(22,163,74,.35); transition:transform .1s,box-shadow .15s,background .15s; margin-top:2px; }
  .btn-add:hover{ background:#15803D; }
  .btn-add:active{ transform:scale(.98); }

  .resumo-diario{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:2px 0 6px; }
  .resumo-diario .pill{ background:var(--branco); border:1px solid var(--cinza-claro); border-radius:14px; padding:11px 13px; box-shadow:var(--sombra-sm); }
  .resumo-diario .pill span{ font-size:11px; color:var(--cinza); font-weight:600; display:flex; align-items:center; gap:5px; }
  .resumo-diario .pill b{ display:block; font-size:17px; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums; }
  .resumo-diario .pill.avista b{ color:var(--alerta); }
  .resumo-diario .pill.credito b{ color:#7C3AED; }

  .grupo-dia{ margin-bottom:6px; }
  .grupo-dia .cabeca{ display:flex; justify-content:space-between; align-items:baseline; padding:14px 2px 6px; }
  .grupo-dia .cabeca .data{ font-size:12px; font-weight:800; color:var(--verde-escuro); text-transform:capitalize; }
  .grupo-dia .cabeca .total{ font-size:12px; font-weight:700; color:var(--cinza); font-variant-numeric:tabular-nums; }

  .vazio{ text-align:center; padding:34px 18px; color:var(--cinza); }
  .vazio .face{ margin-bottom:10px; }
  .vazio .face .ic{ color:var(--verde); opacity:.55; }
  .vazio h3{ font-size:15px; font-weight:800; color:var(--carvao); margin-bottom:6px; }
  .vazio p{ font-size:13px; line-height:1.5; }

  .overlay{ position:fixed; inset:0; background:rgba(6,31,23,.45); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s; z-index:50; backdrop-filter:blur(2px); }
  .overlay.aberta{ opacity:1; pointer-events:auto; }
  .sheet{ width:100%; max-width:440px; background:var(--branco); border-radius:26px 26px 0 0; padding:8px 20px max(24px,env(safe-area-inset-bottom)) 20px; transform:translateY(100%); transition:transform .3s cubic-bezier(.22,1,.36,1); max-height:90dvh; overflow-y:auto; }
  .overlay.aberta .sheet{ transform:none; }
  .puxador{ width:42px; height:5px; border-radius:999px; background:var(--cinza-claro); margin:6px auto 16px; }
  .sheet h2{ font-size:18px; font-weight:800; margin-bottom:4px; }
  .sheet .sub{ font-size:13px; color:var(--cinza); margin-bottom:18px; }
  .grupo-campo{ margin-bottom:14px; }
  .grupo-campo label{ font-size:12px; font-weight:700; color:var(--verde-escuro); display:block; margin-bottom:6px; }
  .grupo-campo input,.grupo-campo select{ width:100%; padding:13px 14px; border-radius:var(--raio-sm); border:1.5px solid var(--cinza-claro); background:var(--branco); font-size:15px; font-weight:600; color:var(--carvao); outline:none; }
  .dois{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .seg{ display:flex; gap:7px; }
  .seg button{ flex:1; padding:11px 4px; border-radius:var(--raio-sm); font-size:12.5px; font-weight:700; background:var(--mint); color:var(--verde-escuro); border:1.5px solid transparent; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:5px; }
  .seg button.on{ background:var(--verde); color:#fff; }
  .seg button[data-prio="alta"].on{ background:var(--alerta); }
  .seg button[data-prio="media"].on{ background:var(--ambar); }
  .sheet-acoes{ display:flex; gap:10px; margin-top:8px; }
  .btn-grande{ flex:1; padding:15px; border-radius:var(--raio-sm); font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; gap:7px; }
  .btn-grande.salvar{ background:var(--verde); color:#fff; box-shadow:0 4px 14px rgba(22,163,74,.35); }
  .btn-grande.salvar:active{ transform:scale(.98); }
  .btn-grande.cancelar{ background:var(--cinza-claro); color:var(--carvao); flex:0 0 auto; padding-left:22px; padding-right:22px; }

  nav{ flex:none; display:flex; background:var(--branco); border-top:1px solid var(--cinza-claro); padding:8px 6px max(8px,env(safe-area-inset-bottom)); position:relative; z-index:10; box-shadow:0 -4px 20px rgba(6,78,59,.05); }
  nav button{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:14px; color:var(--cinza); transition:color .15s,background .15s; }
  nav button .ico .ic{ width:23px; height:23px; vertical-align:0; }
  nav button .txt{ font-size:10.5px; font-weight:700; letter-spacing:.2px; }
  nav button.ativa{ color:var(--verde); }

  .toast{ position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--carvao); color:#fff; padding:12px 18px; border-radius:999px; font-size:13px; font-weight:700; box-shadow:var(--sombra-lg); opacity:0; pointer-events:none; transition:all .3s; z-index:60; white-space:nowrap; max-width:90vw; display:flex; align-items:center; gap:7px; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast .ic{ width:16px; height:16px; vertical-align:0; }
  .toast.ok .ic{ color:var(--verde-vivo); }
  .toast.err .ic{ color:#FCA5A5; }
</style>

<div class="app" id="app">
  <header class="topo">
    <div class="topo-linha">
      <div class="logo">TÔ <span class="fudido">FUDIDO</span><small>CONTROLE FINANCEIRO</small></div>
      <div class="mes-nav">
        <button id="mesPrev" aria-label="Mês anterior"></button>
        <div class="mes-label" id="mesLabel">junho<span>2026</span></div>
        <button id="mesNext" aria-label="Próximo mês"></button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="view ativa" id="view-inicio"></section>
    <section class="view" id="view-diario"></section>
    <section class="view" id="view-mensal"></section>
  </main>

  <nav>
    <button class="ativa" data-view="inicio"><span class="ico" data-ico="home"></span><span class="txt">Início</span></button>
    <button data-view="diario"><span class="ico" data-ico="zap"></span><span class="txt">Diário</span></button>
    <button data-view="mensal"><span class="ico" data-ico="calendar"></span><span class="txt">Mensal</span></button>
  </nav>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== ÍCONES ===================== */
const ICONS = {
  'chevron-left':'<polyline points="15 18 9 12 15 6"/>',
  'chevron-right':'<polyline points="9 18 15 12 9 6"/>',
  'smile':'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/>',
  'meh':'<circle cx="12" cy="12" r="10"/><line x1="8" x2="16" y1="15" y2="15"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/>',
  'frown':'<circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/>',
  'eye':'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',

/* ===================== ESTADO + PERSISTÊNCIA ===================== */
const DB_KEY = 'tofudido:data:v1';
const dadosPadrao = { income:[], monthly:[], daily:[], card:[] };
let state = JSON.parse(JSON.stringify(dadosPadrao));
const hoje = new Date();
let mesAtual = { y: hoje.getFullYear(), m: hoje.getMonth() };
let memoriaFallback = null;
const DIA_VENC_FATURA = 9; // fatura sempre vence dia 9
function chaveMes(o = mesAtual){ return `${o.y}-${String(o.m+1).padStart(2,'0')}`; }

async function carregar(){
  try{
    if(window.storage){ const r = await window.storage.get(DB_KEY); if(r && r.value){ state = { ...dadosPadrao, ...JSON.parse(r.value) }; } }
    else if(memoriaFallback){ state = JSON.parse(memoriaFallback); }
  }catch(e){ console.warn('Falha ao carregar', e); }
  migrarCartoesAntigos();
}
function migrarCartoesAntigos(){
  // versões antigas guardavam compras de cartão em state.card -> vira gasto de crédito no diário
  if(Array.isArray(state.card) && state.card.length){
    state.card.forEach(c=>{
      state.daily.push({ id:c.id||id(), date:c.date, desc:c.desc||'Compra no cartão', amount:c.amount,
        category:'outros', method:'credito', card:'nubank', parcelas:c.parcelas||1, createdAt:Date.now() });
    });
    state.card = [];
    salvar();
  }
}
async function salvar(){
  const json = JSON.stringify(state); memoriaFallback = json;
  try{ if(window.storage){ await window.storage.set(DB_KEY, json); } }catch(e){ console.error('Falha ao salvar', e); }
}

/* ===================== UTILIDADES ===================== */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS_SEM = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const brl = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function parseValor(str){
  if(typeof str === 'number') return str;
  if(!str) return 0;
  let s = String(str).trim().replace(/[^\d,.-]/g,'');
  if(s.includes(',')){ s = s.replace(/\./g,'').replace(',', '.'); }
  const n = parseFloat(s); return isNaN(n)?0:Math.abs(n);
}
function diffMeses(de,para){ const [ya,ma]=de.split('-').map(Number); const [yb,mb]=para.split('-').map(Number); return (yb-ya)*12+(mb-ma); }
const cm = () => chaveMes();
const incomeMes  = () => state.income.filter(x=>x.month===cm());
const monthlyMes = () => state.monthly.filter(x=>x.month===cm());
const dailyMes   = () => state.daily.filter(x=>x.date && x.date.startsWith(cm()));
const creditEntries = () => state.daily.filter(x=>x.method==='credito');
function parcelaNoMes(e){
  const idx = diffMeses(e.date.slice(0,7), cm());
  const n = e.parcelas||1;
  return (idx>=0 && idx<n) ? e.amount/n : 0;
}
const faturaMes = () => creditEntries().reduce((s,e)=>s+parcelaNoMes(e),0);
const faturaCartao = (cardId) => creditEntries().filter(e=>e.card===cardId).reduce((s,e)=>s+parcelaNoMes(e),0);
const qtdCartaoMes = (cardId) => creditEntries().filter(e=>e.card===cardId && parcelaNoMes(e)>0).length;

function totais(){
  const renda  = incomeMes().reduce((s,x)=>s+x.amount,0);
  const contas = monthlyMes().reduce((s,x)=>s+x.amount,0);
  const contasPagas = monthlyMes().filter(x=>x.paid).reduce((s,x)=>s+x.amount,0);
  const dThis = dailyMes();
  const aVista = dThis.filter(x=>x.method!=='credito').reduce((s,x)=>s+x.amount,0);
  const creditoMes = dThis.filter(x=>x.method==='credito').reduce((s,x)=>s+x.amount,0);
  const fatura = faturaMes();
  return { renda, contas, contasPagas, aVista, creditoMes, fatura, saldo: renda-contas-aVista-fatura };
}

function renderMes(){ document.getElementById('mesLabel').innerHTML = `${MESES[mesAtual.m]}<span>${mesAtual.y}</span>`; }

function statusTermometro(t){
  const semDados = t.renda===0 && t.contas===0 && t.aVista===0 && t.fatura===0;
  if(semDados) return { classe:'term-neutro', icone:'eye', titulo:'Bora começar', frase:'Adicione sua renda e suas contas pra ver onde você tá.' };
  if(t.renda===0) return { classe:'term-neutro', icone:'eye', titulo:'Cadê a renda?', frase:'Bota uma renda aí pra eu calcular o estrago.' };
  const ratio = t.saldo/t.renda;
  if(t.saldo<0)   return { classe:'term-fudido',   icone:'frown', titulo:'TÔ FUDIDO',    frase:'Você gastou mais do que ganhou. Segura o cartão!' };
  if(ratio<0.20)  return { classe:'term-atencao',  icone:'meh',   titulo:'Segura a onda', frase:'Tá apertado. Cuidado com o resto do mês.' };
  return                 { classe:'term-tranquilo',icone:'smile', titulo:'Tranquilo',     frase:'Tá sobrando uma grana. Mas fica esperto!' };
}

function renderInicio(){

  const ehMesAtual = mesAtual.y===hoje.getFullYear() && mesAtual.m===hoje.getMonth();

  let vencendo = pendentes.length ? pendentes.slice(0,4).map(c=>{
    const cat = catConta(c.category);
    let st2 = `dia ${c.due}`, tagCls='venc';
    if(ehMesAtual && c.due){
      const d = c.due - hoje.getDate();
      if(d<0){ st2=`${Math.abs(d)}d atrasada`; tagCls='atrasada'; }
      else if(d===0){ st2='vence hoje'; tagCls='hoje'; }
      else if(d<=5){ st2=`vence em ${d}d`; tagCls='venc'; }
    }
    return `<div class="item">
      <div class="icone">${ic(cat.icon)}</div>
      <div class="corpo"><div class="nome">${esc(c.desc)}</div>

      <div class="stat"><div class="rotulo">${ic('zap','ic-sm')} À vista</div><div class="valor" style="color:var(--verde-escuro)">${brl(t.aVista)}</div></div>
    </div>
    <div class="bloco">

    ${listaHTML}`;

  const reMark = (cont, ds, key, val) => { [...cont.children].forEach(x=>x.classList.toggle('on', x.dataset[ds]==String(val))); };
  document.getElementById('chipsCat').onclick = e=>{ const b=e.target.closest('[data-cat]'); if(!b)return; compState.cat=b.dataset.cat; reMark(e.currentTarget,'cat',0,compState.cat); };
  document.getElementById('chipsMet').onclick = e=>{ const b=e.target.closest('[data-met]'); if(!b)return; compState.metodo=b.dataset.met; reMark(e.currentTarget,'met',0,compState.metodo); document.getElementById('creditoBox').classList.toggle('on', compState.metodo==='credito'); };
  document.getElementById('chipsCard').onclick = e=>{ const b=e.target.closest('[data-card]'); if(!b)return; compState.card=b.dataset.card; reMark(e.currentTarget,'card',0,compState.card); };
  document.getElementById('chipsParc').onclick = e=>{ const b=e.target.closest('[data-parc]'); if(!b)return; compState.parcelas=parseInt(b.dataset.parc); reMark(e.currentTarget,'parc',0,compState.parcelas); };
  document.getElementById('dAdd').onclick = addDiario;
  document.getElementById('dValor').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('dDesc').focus(); });
  document.getElementById('dDesc').addEventListener('keydown', e=>{ if(e.key==='Enter') addDiario(); });
}
function addDiario(){
  const valEl=document.getElementById('dValor'), descEl=document.getElementById('dDesc');
  const v = parseValor(valEl.value);
  if(v<=0){ toast('Coloca um valor aí','err'); valEl.focus(); return; }
  const data = (mesAtual.y===hoje.getFullYear() && mesAtual.m===hoje.getMonth()) ? hoje.toISOString().slice(0,10) : `${chaveMes()}-15`;
  const entry = { id:id(), date:data, desc:descEl.value.trim(), amount:v, category:compState.cat, method:compState.metodo, createdAt:Date.now() };
  if(compState.metodo==='credito'){ entry.card = compState.card; entry.parcelas = compState.parcelas; }
  state.daily.push(entry);
  salvar(); valEl.value=''; descEl.value='';
  renderDiario();
  toast(compState.metodo==='credito'?`Lançado no ${getCard(compState.card).nome}`:'Gasto anotado','ok');
  document.getElementById('dValor').focus();
}

function labelPrio(p){ return p==='alta'?'Alta':p==='media'?'Média':'Baixa'; }
function renderMensal(){
  const t = totais();
  const renda = incomeMes();
  const contas = monthlyMes().sort((a,b)=>{ const o={alta:0,media:1,baixa:2}; return o[a.priority]!==o[b.priority]?o[a.priority]-o[b.priority]:(a.due||99)-(b.due||99); });
  const falta = t.contas-t.contasPagas;
  const pct = t.contas>0?Math.round((t.contasPagas/t.contas)*100):0;

  let rendaHTML = renda.length ? renda.map(r=>`
    <div class="item">
      <div class="icone" style="background:var(--verde-claro)">${ic('wallet')}</div>
      <div class="corpo"><div class="nome">${esc(r.desc||'Renda')}</div></div>
      <div class="preco" style="color:var(--verde)">+${brl(r.amount)}</div>
      <div class="item-botoes"><button class="mini-btn del" data-del-income="${r.id}" aria-label="Excluir">${ic('trash','ic-sm')}</button></div>
    </div>`).join('') : `<div class="vazio" style="padding:18px 6px"><div class="face">${ic('wallet')}</div><p>Adicione seu salário, freelas, vendas…</p></div>`;

  let contasHTML;
  if(contas.length){
    contasHTML = contas.map(c=>{
      const cat = catConta(c.category);
      const ehMesAtual = mesAtual.y===hoje.getFullYear() && mesAtual.m===hoje.getMonth();
      let venc=`dia ${c.due||'—'}`, vcls='venc';
      if(!c.paid && ehMesAtual && c.due){
        const d=c.due-hoje.getDate();
        if(d<0){ venc=`${Math.abs(d)}d atrasada`; vcls='atrasada'; }
        else if(d===0){ venc='vence hoje'; vcls='hoje'; }
        else if(d<=5){ venc=`vence em ${d}d`; vcls='venc'; }
      }
      return `<div class="item" style="opacity:${c.paid?'.55':'1'}">
        <button class="checkbtn ${c.paid?'on':''}" data-toggle-paid="${c.id}" aria-label="Marcar paga">${c.paid?ic('check'):''}</button>
        <div class="corpo"><div class="nome" style="${c.paid?'text-decoration:line-through':''}">${ic(cat.icon,'inline-cat')} ${esc(c.desc)}</div>
          <div class="sub"><span class="tag ${c.priority}">${labelPrio(c.priority)}</span>${c.paid?'<span class="tag paga">paga</span>':`<span class="tag ${vcls}">${venc}</span>`}</div></div>
        <div class="preco neg">${brl(c.amount)}</div>
        <div class="item-botoes"><button class="mini-btn del" data-del-monthly="${c.id}" aria-label="Excluir">${ic('trash','ic-sm')}</button></div>
      </div>`;
    }).join('');
  } else {
    contasHTML = `<div class="vazio"><div class="face">${ic('file')}</div><h3>Sem contas cadastradas</h3><p>Aluguel, luz, água, internet… bota tudo aqui pra não esquecer.</p></div>`;
  }

  document.getElementById('view-mensal').innerHTML = `
    <div class="bloco">
      <div class="bloco-titulo"><h2>${ic('wallet','ic-sm')} Renda do mês</h2><button class="acao" id="addRenda">${ic('plus','ic-xs')} adicionar</button></div>
      ${rendaHTML}
      <div style="border-top:2px solid var(--cinza-claro); margin-top:10px; padding-top:12px; display:flex; justify-content:space-between; font-weight:800; font-size:15px"><span>Total</span><span style="color:var(--verde)">${brl(t.renda)}</span></div>
    </div>
    <div class="bloco">
      <div class="bloco-titulo"><h2>${ic('calendar','ic-sm')} Contas de casa</h2><button class="acao" id="addConta">${ic('plus','ic-xs')} adicionar</button></div>
      ${contasHTML}
      ${contas.length ? `<div style="border-top:2px solid var(--cinza-claro); margin-top:10px; padding-top:12px">
        <div class="progresso"><span style="width:${pct}%"></span></div>
        <div class="resumo-mensal"><span>Pago: <b style="color:var(--verde)">${brl(t.contasPagas)}</b></span><span>Falta: <b style="color:var(--alerta)">${brl(falta)}</b></span></div></div>` : ''}
    </div>
    <div class="bloco" style="background:linear-gradient(135deg,var(--mint),var(--verde-claro)); border:none">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <div>
          <div style="font-size:12px; font-weight:700; color:var(--verde-escuro); display:flex; align-items:center; gap:6px">${ic('calculator','ic-sm')} Cálculo rápido</div>
          <div style="font-size:11px; color:var(--cinza); margin-top:2px">Renda − contas − à vista − cartões</div>
        </div>
        <div style="font-size:22px; font-weight:800; color:${t.saldo<0?'var(--alerta)':'var(--verde-escuro)'}; font-variant-numeric:tabular-nums">${brl(t.saldo)}</div>
      </div>
    </div>`;
  document.getElementById('addRenda').onclick = abrirSheetRenda;
  document.getElementById('addConta').onclick = abrirSheetConta;
}

/* ===================== SHEETS ===================== */
const overlay = document.getElementById('overlay'), sheet = document.getElementById('sheet');
function fecharSheet(){ overlay.classList.remove('aberta'); }
overlay.addEventListener('click', e=>{ if(e.target===overlay) fecharSheet(); });
function abrirSheet(html){ sheet.innerHTML = `<div class="puxador"></div>${html}`; overlay.classList.add('aberta'); }

function abrirSheetRenda(){
  abrirSheet(`
    <h2>Adicionar renda</h2><p class="sub">Salário, freela, venda, qualquer dinheiro que entrou.</p>
    <div class="grupo-campo"><label>De onde veio?</label><input id="rDesc" placeholder="Ex: Salário, Freela do site…" maxlength="40"></div>
    <div class="grupo-campo"><label>Valor</label><input id="rValor" inputmode="decimal" placeholder="R$ 0,00"></div>
    <div class="sheet-acoes"><button class="btn-grande cancelar" onclick="fecharSheet()">Cancelar</button><button class="btn-grande salvar" id="rSalvar">${ic('check','ic-sm')} Salvar renda</button></div>`);
  setTimeout(()=>document.getElementById('rDesc').focus(),200);
  document.getElementById('rSalvar').onclick = ()=>{
    const v=parseValor(document.getElementById('rValor').value);
    if(v<=0){ toast('Coloca o valor da renda','err'); return; }
    state.income.push({ id:id(), month:cm(), desc:document.getElementById('rDesc').value.trim()||'Renda', amount:v });
    salvar(); fecharSheet(); renderAtual(); toast('Renda adicionada','ok');
  };
}

let contaSel = { prioridade:'media', categoria:'moradia' };
function abrirSheetConta(){
  contaSel = { prioridade:'media', categoria:'moradia' };
  const cats = CATS_CONTA.map(c=>`<button class="chip ${c.id==='moradia'?'on':''}" data-cc="${c.id}">${ic(c.icon,'ic-sm')} ${c.nome}</button>`).join('');
  abrirSheet(`
    <h2>Nova conta</h2><p class="sub">Conta de casa, assinatura, parcela… o que vence todo mês.</p>
    <div class="grupo-campo"><label>Nome da conta</label><input id="cDesc" placeholder="Ex: Aluguel, Conta de luz…" maxlength="40"></div>
    <div class="dois">
      <div class="grupo-campo"><label>Valor</label><input id="cValor" inputmode="decimal" placeholder="R$ 0,00"></div>
      <div class="grupo-campo"><label>Dia do vencimento</label><input id="cDia" inputmode="numeric" placeholder="Ex: 10" maxlength="2"></div>
    </div>
    <div class="grupo-campo"><label>Prioridade de pagamento</label>
      <div class="seg" id="cPrio">
        <button data-prio="alta"><span class="dot dot-alta"></span> Alta</button>
        <button data-prio="media" class="on"><span class="dot dot-media"></span> Média</button>
        <button data-prio="baixa"><span class="dot dot-baixa"></span> Baixa</button>
      </div>
    </div>
    <div class="grupo-campo"><label>Categoria</label><div class="chips" id="cCats" style="margin-bottom:0">${cats}</div></div>
    <div class="sheet-acoes"><button class="btn-grande cancelar" onclick="fecharSheet()">Cancelar</button><button class="btn-grande salvar" id="cSalvar">${ic('check','ic-sm')} Salvar conta</button></div>`);
  setTimeout(()=>document.getElementById('cDesc').focus(),200);
  document.getElementById('cPrio').onclick = e=>{ const b=e.target.closest('[data-prio]'); if(!b)return; contaSel.prioridade=b.dataset.prio; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); };
  document.getElementById('cCats').onclick = e=>{ const b=e.target.closest('[data-cc]'); if(!b)return; contaSel.categoria=b.dataset.cc; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); };
  document.getElementById('cSalvar').onclick = ()=>{
    const v=parseValor(document.getElementById('cValor').value);
    const desc=document.getElementById('cDesc').value.trim();
    let dia=parseInt(document.getElementById('cDia').value)||null; if(dia) dia=Math.min(31,Math.max(1,dia));
    if(!desc){ toast('Dá um nome pra conta','err'); return; }
    if(v<=0){ toast('Coloca o valor da conta','err'); return; }
    state.monthly.push({ id:id(), month:cm(), desc, amount:v, due:dia, priority:contaSel.prioridade, category:contaSel.categoria, paid:false });
    salvar(); fecharSheet(); renderAtual(); toast('Conta adicionada','ok');
  };
}

/* ===================== AÇÕES ===================== */
document.getElementById('main').addEventListener('click', e=>{
  const goto=e.target.closest('[data-goto]'); if(goto){ trocarView(goto.dataset.goto); return; }
  const di=e.target.closest('[data-del-income]'); if(di){ confirmar('Excluir essa renda?',()=>{ state.income=state.income.filter(x=>x.id!==di.dataset.delIncome); salvar(); renderAtual(); toast('Renda removida'); }); return; }
  const dm=e.target.closest('[data-del-monthly]'); if(dm){ confirmar('Excluir essa conta?',()=>{ state.monthly=state.monthly.filter(x=>x.id!==dm.dataset.delMonthly); salvar(); renderAtual(); toast('Conta removida'); }); return; }
  const dd=e.target.closest('[data-del-daily]'); if(dd){ state.daily=state.daily.filter(x=>x.id!==dd.dataset.delDaily); salvar(); renderAtual(); toast('Gasto removido'); return; }
  const tp=e.target.closest('[data-toggle-paid]'); if(tp){ const c=state.monthly.find(x=>x.id===tp.dataset.togglePaid); if(c){ c.paid=!c.paid; salvar(); renderAtual(); toast(c.paid?'Conta paga':'Marcada como pendente'); } return; }
});
function confirmar(msg, ok){
  abrirSheet(`<h2 style="margin-bottom:8px">${msg}</h2><p class="sub">Essa ação não tem volta.</p>
    <div class="sheet-acoes"><button class="btn-grande cancelar" onclick="fecharSheet()">Não</button>
    <button class="btn-grande salvar" id="confSim" style="background:var(--alerta); box-shadow:none">${ic('trash','ic-sm')} Sim, excluir</button></div>`);
  document.getElementById('confSim').onclick = ()=>{ ok(); fecharSheet(); };
}

/* ===================== NAV + RENDER MESTRE ===================== */
let viewAtual='inicio';
function trocarView(v){
  viewAtual=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('ativa', s.id==='view-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('ativa', b.dataset.view===v));
  document.getElementById('main').scrollTop=0; renderAtual();
}
document.querySelector('nav').addEventListener('click', e=>{ const b=e.target.closest('[data-view]'); if(b) trocarView(b.dataset.view); });
function renderAtual(){
  renderMes();
  if(viewAtual==='inicio') renderInicio();
  else if(viewAtual==='diario') renderDiario();
  else if(viewAtual==='mensal') renderMensal();
}
document.getElementById('mesPrev').onclick = ()=>{ mesAtual.m--; if(mesAtual.m<0){mesAtual.m=11; mesAtual.y--;} renderAtual(); };
document.getElementById('mesNext').onclick = ()=>{ mesAtual.m++; if(mesAtual.m>11){mesAtual.m=0; mesAtual.y++;} renderAtual(); };

/* ===================== TOAST + ESCAPE ===================== */
let toastTimer=null;
function toast(msg, tipo=''){
  const el=document.getElementById('toast');
  const icone = tipo==='ok'?ic('check'):tipo==='err'?ic('alert'):'';
  el.className='toast '+(tipo||'')+' show';
  el.innerHTML = icone + `<span>${esc(msg)}</span>`;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===================== BOOT ===================== */
(async function init(){ pintarIconesEstaticos(); await carregar(); renderAtual(); })();
</script>
